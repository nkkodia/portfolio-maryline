<section class="min-h-screen pt-32 pb-20 px-6 bg-slate-950">
  <div class="max-w-3xl mx-auto">

    <div class="mb-12 animate-fade-in-up">
      <h2 class="text-4xl font-black italic bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-4">
        Parlons de votre projet.
      </h2>
      <p class="text-slate-400">
        Prête à transformer vos défis techniques en solutions élégantes.
        Laissez-moi vos coordonnées, je vous recontacte sous 24h.
      </p>
    </div>

    <form [formGroup]="contactForm" class="space-y-6 animate-fade-in-up delay-200">
      <div class="grid md:grid-cols-2 gap-6">
        <div class="space-y-2">
          <label class="text-xs font-mono text-blue-400 uppercase tracking-widest ml-1">Votre Nom</label>
          <input type="text" formControlName="name" placeholder="Ex: Jean Dupont"
                 class="w-full bg-slate-900/50 border border-slate-800 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/20 p-4 rounded-2xl outline-none text-white transition-all">
        </div>

        <div class="space-y-2">
          <label class="text-xs font-mono text-emerald-400 uppercase tracking-widest ml-1">Comment vous joindre ?</label>
          <input type="text" formControlName="contactMethod" placeholder="Email ou Téléphone"
                 class="w-full bg-slate-900/50 border border-slate-800 focus:border-emerald-500/50 focus:ring-1 focus:ring-emerald-500/20 p-4 rounded-2xl outline-none text-white transition-all">
          <p class="text-[9px] text-emerald-500/80 italic ml-1">
            <i class="bi bi-whatsapp"></i> Si numéro, WhatsApp uniquement svp.
          </p>
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-xs font-mono text-blue-400 uppercase tracking-widest ml-1">Sujet du projet</label>
        <input type="text" formControlName="subject" placeholder="Site e-commerce, vitrine..."
               class="w-full bg-slate-900/50 border border-slate-800 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/20 p-4 rounded-2xl outline-none text-white transition-all">
      </div>

      <div class="space-y-2">
        <label class="text-xs font-mono text-blue-400 uppercase tracking-widest ml-1">Message</label>
        <textarea formControlName="message" rows="5" placeholder="Décrivez votre besoin..."
                  class="w-full bg-slate-900/50 border border-slate-800 focus:border-blue-500/50 focus:ring-1 focus:ring-blue-500/20 p-4 rounded-2xl outline-none text-white transition-all"></textarea>
      </div>

      <button type="button"
              (click)="sendEmail()"
              [disabled]="contactForm.invalid"
              [class.opacity-30]="contactForm.invalid"
              [class.grayscale]="contactForm.invalid"
              [class.cursor-not-allowed]="contactForm.invalid"
              class="group relative w-full p-5 rounded-2xl font-bold text-white overflow-hidden transition-all bg-gradient-to-r from-blue-600 to-blue-500"
              [ngClass]="{'hover:shadow-[0_0_30px_rgba(37,99,235,0.3)] hover:scale-[1.01] active:scale-[0.98]': contactForm.valid}">

    <span class="relative z-10 text-sm">
      @if (contactForm.invalid) {
        Merci de remplir tous les champs
      } @else {
        Envoyer mon message
      }
    </span>

        @if (contactForm.valid) {
          <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
        }
      </button>
    </form>

  </div>
</section>
