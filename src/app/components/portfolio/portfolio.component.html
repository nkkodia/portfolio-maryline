<section id="portfolio" class="py-24 bg-slate-950 text-white px-6">
  <div class="max-w-6xl mx-auto">
    <div class="mb-16 animate-fade-in-up">
      <h2 class="text-4xl md:text-5xl font-black mb-4">Mes Réalisations</h2>
      <p class="text-slate-400 italic">Des projets concrets, du code propre, des clients heureux.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (project of projects; track project.title) {
        <div [class]="'group relative overflow-hidden rounded-3xl bg-slate-900 border border-slate-800 animate-fade-in-up ' + project.delay">
          <div class="h-56 overflow-hidden">
            <img [src]="project.img" [alt]="project.title"
                 class="w-full h-full object-cover grayscale-[50%] group-hover:grayscale-0 group-hover:scale-110 transition-all duration-700">
          </div>

          <div class="p-6">
            <span class="text-blue-400 text-[10px] font-mono uppercase tracking-[0.2em]">{{ project.category }}</span>
            <h3 class="text-2xl font-bold mt-2 mb-3">{{ project.title }}</h3>
            <p class="text-slate-400 text-sm mb-6 leading-relaxed">{{ project.desc }}</p>

            <div class="flex flex-wrap gap-2">
              @for (tag of project.techs; track tag) {
                <span class="px-3 py-1 bg-slate-800 text-slate-300 text-[10px] rounded-full border border-slate-700">
                  {{ tag }}
                </span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
