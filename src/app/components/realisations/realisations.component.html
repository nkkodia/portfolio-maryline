<section class="min-h-screen pt-32 pb-20 px-6 bg-[#0f172a] relative overflow-hidden">

  <div class="absolute top-0 -right-20 w-96 h-96 bg-blue-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-0 -left-20 w-96 h-96 bg-[#4B2C5E]/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="fixed inset-0 z-0">
    <img src="background_real.jpg"
         class="w-full h-full object-cover opacity-10"
         alt="Background Tech">
  </div>
  <div class="max-w-6xl mx-auto relative z-10">
    <div class="mb-16 animate-fade-in-up">
      <h2 class="text-4xl font-black italic bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-4">
        Mes Réalisations.
      </h2>
      <p class="text-slate-300 max-w-2xl"> Découvrez comment j'accompagne mes clients dans la création de leur identité numérique,
        du conseil stratégique à la mise en ligne.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
      @for (project of projects; track project.title) {
        <div class="group bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2.5rem] overflow-hidden hover:border-blue-400/50 transition-all duration-500 shadow-2xl hover:bg-white/10">

          <div class="aspect-video relative overflow-hidden bg-slate-800">
            <img [src]="project.image" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-700">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0f172a]/80 to-transparent"></div>
          </div>

          <div class="p-8">
            <span class="text-[10px] font-mono text-emerald-400 uppercase tracking-widest">{{ project.tech }}</span>
            <h3 class="text-2xl font-bold text-white mt-2 mb-4">{{ project.title }}</h3>
            <p class="text-slate-300 text-sm mb-8 leading-relaxed italic">"{{ project.desc }}"</p>

            <a [href]="project.link" target="_blank"
               class="inline-flex items-center gap-2 text-white font-bold text-sm hover:text-blue-400 transition-colors group/link">
              Visiter le site
              <i class="bi bi-arrow-right group-hover/link:translate-x-2 transition-transform"></i>
            </a>
          </div>
        </div>
      }
    </div>
  </div>
</section>
